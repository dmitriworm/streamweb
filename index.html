<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamWeb Trailers — Movies · Series · Anime</title>
  <meta name="description" content="Discover movies, series and anime trailers in an animated spider-web interface. Keyless APIs: TVMaze, Jikan, iTunes." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/aurora.css" />
  <link rel="stylesheet" href="css/web-map.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/player.css" />
</head>
<body>
  <div class="aurora"></div>

  <header>
    <div class="logo">Stream<span>Web</span></div>
    <nav id="nav">
      <button data-view="web" class="active">Web Map</button>
      <button data-view="movies">Movies</button>
      <button data-view="series">Series</button>
      <button data-view="anime">Anime</button>
      <button data-view="watchlist">★ Watchlist</button>
    </nav>
    <input id="search" placeholder="🔍 Search movies, series, anime..." autocomplete="off" />
  </header>

  <!-- AD SLOT: header banner -->
  <div class="ad ad-banner" data-ad-slot="header"></div>

  <main id="view" class="container"></main>

  <!-- AD SLOT: footer banner (replaces the lopsided right rail) -->
  <div class="ad ad-banner" data-ad-slot="sidebar"></div>

  <footer>
    <p>StreamWeb Trailers · Data: <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVMaze</a> · <a href="https://jikan.moe" target="_blank" rel="noopener">Jikan/MyAnimeList</a> · Apple iTunes · Trailers via YouTube</p>
  </footer>

  <!-- Trailer modal -->
  <div class="modal" id="modal">
    <div class="player-box">
      <div id="yt-host"><div id="yt-player"></div></div>
      <!-- AD SLOT: under player -->
      <div class="ad ad-player" data-ad-slot="player"></div>
      <h2 id="p-title"></h2>
      <p id="p-meta"></p>
      <div class="player-controls">
        <button id="p-watch">★ Add to watchlist</button>
        <button id="p-close">✕ Close</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/web-map.js"></script>
  <script src="js/views.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
